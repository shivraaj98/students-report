services:
  n8n:
    build:
      context: .
      dockerfile: automation/n8n.Dockerfile
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Kathmandu
      TZ: Asia/Kathmandu
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      CLASSBRIDGE_INTERNAL_TOKEN: ${CLASSBRIDGE_INTERNAL_TOKEN:?Run node scripts/setup-automation.js first}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
  automation:
    build:
      context: .
      dockerfile: automation/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      DATA_DIR: /data
      TZ: Asia/Kathmandu
      CLASSBRIDGE_INTERNAL_TOKEN: ${CLASSBRIDGE_INTERNAL_TOKEN:?Run node scripts/setup-automation.js first}
      CLASSBRIDGE_SETUP_TOKEN: ${CLASSBRIDGE_SETUP_TOKEN:?Run node scripts/setup-automation.js first}
      CLASSBRIDGE_MASTER_KEY: ${CLASSBRIDGE_MASTER_KEY:?Run node scripts/setup-automation.js first}
      N8N_URL: http://n8n:5678
      CLASSBRIDGE_PUBLIC_ORIGIN: ${CLASSBRIDGE_PUBLIC_ORIGIN:-}
    volumes:
      - automation_data:/data
    shm_size: 512mb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  share:
    image: cloudflare/cloudflared:latest
    profiles: [share]
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, "http://automation:8787"]
    depends_on:
      automation:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:
  automation_data:
